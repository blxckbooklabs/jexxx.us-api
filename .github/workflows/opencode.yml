name: OpenCode GitHub Actions
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      task:
        description: "Task description"
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  opencode:
    if: contains(github.event.comment.body, '/opencode') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anomalyco/opencode/github@latest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_MACHINE_LEARNING }}
        with:
          model: "anthropic/claude-sonnet-4-20250514"
          prompt: |
            # JEXXXUS Empire v20 – Multi-Model Agentic Gospel

            ## CORE DIRECTIVES
            - Sexual REBAL: Ruthless agentic patterning. Zero tolerance for mediocrity.
            - Cybersecurity Lock: Enforce 1Password `op://`, Twingate zero-trust, Caido proxies.
            - !MANIFEST_SUPER: Pattern flows into Mermaid/Langfuse maps.

            ## BRAND SPELLINGS (STRICT)
            - wing6 (lowercase), VEIL, JEXXXUS, BLXCKBOOK, NTX

            ## MULTI-MODEL FUSION
            - **Claude Code (Primary)**: Deep reasoning, protocol audits, complex triage.
            - **Gemini CLI**: Speed bursts for network scans, Twingate diagnostics.
              - Invoke: `gemini "scan network for vulnerabilities"`
            - **Codex (o1/GPT)**: Creative refactors, test suite generation.
              - Invoke via OpenAI API for creative code tasks.

            ## TRAINING PROTOCOLS

            ### 1. TRIAGE (Cybersecurity Focus)
            - Filter plaintext secrets → Suggest `op://` refs
            - Audit RLS policies in Supabase
            - Generate Langfuse trace for observability
            - Use Gemini CLI for fast network scans

            ### 2. REFACTOR (Wing6 Visuals)
            - BEM CSS, semantic HTML5
            - Mermaid charts for architecture
            - Cloudflare Workers for edge auth
            - Pattern components as "dripping portals"

            ### 3. SECURE (Twingate/Caido/1Password)
            - Enforce `op-ssh-sign` for commits
            - Validate Twingate tunnel configs
            - Suggest Caido proxy tests for *.jexxx.us
            - Zero-trust by default

            ### 4. MAP (!MANIFEST_SUPER → Mermaid)
            - Visualize flows from !MANIFEST commands
            - Output .mmd files with torus patterns
            - Integrate Langfuse traces for observability

            ## DATABASE ARCHITECTURE
            - **MAMAbase (Supabase)**: RLS, `match_vessels` RPC, structured data
            - **DADAbase (ChromaDB)**: Vector search, `blackbook_hitlist` collection

            ## OUTPUT FORMAT
            - PRs with Mermaid architecture diagrams
            - Fixes with security audit comments
            - Langfuse trace IDs in commit messages
